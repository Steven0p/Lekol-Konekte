<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lekòl Konekte</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1.5rem; padding: 2rem;
    background: linear-gradient(160deg, #1A365D 0%, #2B4C7E 100%);
    color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    text-align: center;
  }
  .logo { font-size: 1.1rem; letter-spacing: 3px; opacity: .85; }
  h1 { font-size: 1.5rem; margin: 0; }
  .spinner {
    width: 46px; height: 46px; border: 4px solid rgba(255,255,255,.25);
    border-top-color: #fff; border-radius: 50%; animation: tourne 1s linear infinite;
  }
  @keyframes tourne { to { transform: rotate(360deg); } }
  .journal {
    width: min(560px, 90vw); max-height: 160px; overflow: hidden;
    font-family: 'Liberation Mono', Consolas, monospace; font-size: .8rem;
    color: #CBD5E0; background: rgba(0,0,0,.18); border-radius: 8px; padding: .75rem 1rem;
    text-align: left; line-height: 1.5;
  }
  .journal div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
  <div class="logo">LEKÒL KONEKTE</div>
  <div class="spinner"></div>
  <h1 id="etat">Démarrage en cours…</h1>
  <div class="journal" id="journal"></div>
<script>
  const journal = document.getElementById('journal');
  const etat = document.getElementById('etat');
  const lignes = [];
  window.posteAPI?.surLog((message) => {
    if (/Prêt/i.test(message)) etat.textContent = 'Prêt.';
    lignes.push(message);
    while (lignes.length > 6) lignes.shift();
    journal.innerHTML = lignes.map((l) => `<div>${l.replace(/[<>&]/g, '')}</div>`).join('');
  });
</script>
</body>
</html>
