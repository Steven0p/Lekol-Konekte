# Déploiement de TOUTE l'application (backend + frontend) sur Render, en UN seul
# service — comme Railway : le backend Express sert le frontend compilé (même
# domaine, donc pas de CORS ni de cookie cross-site).
#
# La base MySQL est managée à part (TiDB / Aiven, gratuit) : renseigner les
# DB_* dans le dashboard. SESSION_SECRET est généré automatiquement.
services:
  - type: web
    name: lekol-konekte
    runtime: node
    plan: free
    rootDir: backend
    # Installe le backend PUIS compile le frontend (script "build" du backend) :
    buildCommand: npm install && npm run build
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      # Base MySQL managée (TiDB / Aiven) — TLS obligatoire :
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      # Services optionnels (imel / IA) :
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GROQ_API_KEY
        sync: false
